<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TheMando · 3D 太阳系知识门户 — 每个知识板块对应一颗环日运行的行星，点击星球跃迁至对应资源推送舱。" />
  <title>TheMando · 太阳系知识引力门户</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    if (location.hash.startsWith('#post=') || location.hash.startsWith('#mdfile=')) {
      location.replace('./hub.html' + location.hash);
    }
  </script>
  <style>
    :root {
      --bg: #02050E;
      --glass: rgba(8, 15, 32, 0.56);
      --glass-strong: rgba(11, 21, 44, 0.82);
      --fg: #F8FAFC;
      --fg-muted: #94A3B8;
      --border: rgba(56, 189, 248, 0.18);
      --border-strong: rgba(56, 189, 248, 0.48);
      --accent: #38BDF8;
      --cyan: #22D3EE;
      --amber: #F59E0B;
      --emerald: #22C55E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    a, button, input { font: inherit; }
    a, button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Interactive 3D Solar System Stage */
    .solar-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    #solarCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #solarCanvas:active { cursor: grabbing; }
    #solarCanvas.hovering-planet { cursor: pointer; }

    .space-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 32%, rgba(2, 5, 14, 0.72) 92%);
    }

    /* Floating 3D Planet Anchor Labels */
    .planet-labels-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .planet-tag {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(7, 14, 30, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
      will-change: transform, opacity;
    }

    .planet-tag:hover {
      background: rgba(14, 30, 62, 0.95);
      border-color: var(--cyan);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.55);
    }

    .planet-tag.dormant {
      pointer-events: none;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 500;
      color: rgba(148, 163, 184, 0.65);
      border-color: rgba(148, 163, 184, 0.16);
      background: rgba(6, 11, 24, 0.52);
      box-shadow: none;
    }

    .planet-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .planet-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
    }

    /* Hyperspace Warp Curtain */
    .warp-curtain {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 48%, rgba(251, 191, 36, 0.22), rgba(56, 189, 248, 0.25) 35%, #02050E 78%);
      transition: opacity 340ms ease;
    }
    .warp-curtain.active { opacity: 1; }

    /* Foreground UI Layout (Pass-through clicks to 3D planets in open space!) */
    .portal-shell {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .portal-shell { padding: 24px 36px 28px; }
    }

    .ui-interactive { pointer-events: auto; }

    /* Top HUD Header */
    .portal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--fg);
    }

    .nav-logo-mini {
      width: 50px;
      height: 28px;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }

    .nav-brand-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.05em;
    }

    .nav-telemetry {
      display: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
    }
    @media (min-width: 920px) {
      .nav-telemetry { display: inline-flex; align-items: center; gap: 12px; }
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .hud-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.08);
      color: var(--fg);
      font-size: 0.83rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .hud-btn:hover {
      border-color: var(--border-strong);
      background: rgba(56, 189, 248, 0.16);
      box-shadow: 0 0 18px -4px rgba(56, 189, 248, 0.45);
    }

    /* Frameless Pure Floating LMX Hero Centerpiece */
    .hero-top-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 10px;
    }

    .frameless-lmx-wrap {
      margin-bottom: 8px;
      pointer-events: none;
    }

    .frameless-lmx-svg {
      width: clamp(168px, 20vw, 232px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.45));
    }

    .lmx-glow-under {
      filter: blur(9px);
      opacity: 0.58;
    }

    .lmx-stroke-draw {
      stroke-dasharray: 820;
      stroke-dashoffset: 820;
      animation: drawLmx 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .lmx-plasma-pulse {
      stroke-dasharray: 105 735;
      stroke-dashoffset: 840;
      animation: pulseLmx 4s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite;
    }

    @keyframes drawLmx { to { stroke-dashoffset: 0; } }
    @keyframes pulseLmx {
      0% { stroke-dashoffset: 840; opacity: 0; }
      15%, 85% { opacity: 1; }
      100% { stroke-dashoffset: -105; opacity: 0; }
    }

    .portal-title {
      font-size: clamp(1.75rem, 3.6vw, 2.85rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.85);
    }

    .holo-span {
      background: linear-gradient(120deg, #FDE68A 5%, #F8FAFC 32%, #38BDF8 68%, #22D3EE 95%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textFlow 6s linear infinite;
    }
    @keyframes textFlow { to { background-position: 200% center; } }

    .solar-hint {
      font-size: 0.88rem;
      color: var(--fg-muted);
      max-width: 580px;
      margin-bottom: 16px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    .cta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .plasma-cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      color: #FFFFFF;
      text-decoration: none;
      background: linear-gradient(135deg, #1D4ED8 0%, #0284C7 58%, #0891B2 100%);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.55), 0 10px 30px -6px rgba(2, 132, 199, 0.7);
      overflow: hidden;
      transition: transform 180ms ease, box-shadow 200ms ease;
    }
    .plasma-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px #38BDF8, 0 14px 36px -4px rgba(56, 189, 248, 0.8);
    }

    .portal-search {
      position: relative;
      width: 275px;
      display: flex;
      align-items: center;
    }

    .portal-search input {
      width: 100%;
      height: 46px;
      padding: 0 38px 0 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass-strong);
      backdrop-filter: blur(14px);
      color: var(--fg);
      font-size: 0.85rem;
    }
    .portal-search input::placeholder { color: var(--fg-muted); }
    .portal-search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .portal-search svg {
      position: absolute;
      left: 13px;
      width: 16px;
      height: 16px;
      color: var(--accent);
      pointer-events: none;
    }
    .portal-search kbd {
      position: absolute;
      right: 13px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--fg-muted);
      pointer-events: none;
    }

    /* Bottom Planetary Roster Dock (Auto-scales as new categories are uploaded!) */
    .planetary-dock {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
    }

    .dock-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--fg-muted);
    }

    .dock-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .orbit-roster {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .orbit-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(15, 25, 48, 0.72);
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      font-size: 0.83rem;
      transition: border-color 180ms ease, transform 180ms ease, background-color 180ms ease;
    }

    .orbit-chip.active:hover,
    .orbit-chip.active.focused {
      border-color: var(--cyan);
      background: rgba(29, 78, 216, 0.28);
      transform: translateY(-2px);
    }

    .orbit-chip.unclaimed {
      opacity: 0.52;
      border-style: dashed;
      cursor: default;
    }

    .orbit-sphere-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .orbit-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .orbit-planet-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--fg-muted);
    }

    .orbit-cat-name {
      font-weight: 700;
      font-size: 0.84rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .lmx-stroke-draw { stroke-dashoffset: 0 !important; }
      .lmx-plasma-pulse { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="solar-stage">
    <canvas id="solarCanvas"></canvas>
  </div>
  <div class="space-vignette" aria-hidden="true"></div>
  <div class="planet-labels-layer" id="planetLabelsLayer"></div>
  <div class="warp-curtain" id="warpCurtain" aria-hidden="true"></div>

  <!-- SVG Gradients for Frameless LMX Mark -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lmxBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#60A5FA" />
        <stop offset="52%" stop-color="#38BDF8" />
        <stop offset="100%" stop-color="#22D3EE" />
      </linearGradient>
      <linearGradient id="lmxPlasmaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
      </linearGradient>
    </defs>
  </svg>

  <div class="portal-shell">
    <!-- Top Glass Bar (No Light Mode Toggle) -->
    <header class="portal-nav ui-interactive">
      <a href="./index.html" class="nav-brand" aria-label="TheMando 太阳系门户">
        <svg class="nav-logo-mini" viewBox="0 0 310 172" fill="none" stroke="url(#lmxBrandGrad)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M 88 22 L 30 114 Q 24 123 35 123 L 96 123 Q 105 123 108 114 L 119 62 Q 123 47 132 60 L 160 112 Q 167 124 171 110 L 182 62 Q 186 46 198 58 L 268 122 Q 280 132 280 116 L 280 62 Q 280 45 268 57 L 168 154" />
        </svg>
        <span class="nav-brand-text">THEMANDO SOLAR</span>

      <div class="nav-telemetry" id="solarTelemetry">
        <span>SOLAR KNOWLEDGE SYSTEM</span>
        <span>·</span>
        <span id="activePlanetsStat">已点亮 2 / 8 颗知识行星</span>
      </div>

      <div class="nav-actions">
        <a href="./hub.html" class="hud-btn warp-link" style="border-color:var(--border-strong);color:var(--accent);">
          <span>全部资源推送舱</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
        <a href="https://github.com/gohmadein/themando" target="_blank" rel="noopener noreferrer" class="hud-btn" aria-label="访问 GitHub 源仓库">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Frameless Floating LMX Mark + Title -->
    <main class="hero-top-overlay">
      <div class="frameless-lmx-wrap">
        <svg class="frameless-lmx-svg" viewBox="0 0 310 172" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="LMX 标志">
          <path class="lmx-glow-under" stroke="url(#lmxBrandGrad)" stroke-width="19" d="M 88 22 L 30 114 Q 24 123 35 123 L 96 123 Q 105 123 108 114 L 119 62 Q 123 47 132 60 L 160 112 Q 167 124 171 110 L 182 62 Q 186 46 198 58 L 268 122 Q 280 132 280 116 L 280 62 Q 280 45 268 57 L 168 154" />
          <path class="lmx-stroke-draw" stroke="url(#lmxBrandGrad)" stroke-width="15.5" d="M 88 22 L 30 114 Q 24 123 35 123 L 96 123 Q 105 123 108 114 L 119 62 Q 123 47 132 60 L 160 112 Q 167 124 171 110 L 182 62 Q 186 46 198 58 L 268 122 Q 280 132 280 116 L 280 62 Q 280 45 268 57 L 168 154" />
          <path class="lmx-plasma-pulse" stroke="url(#lmxPlasmaGrad)" stroke-width="6" d="M 88 22 L 30 114 Q 24 123 35 123 L 96 123 Q 105 123 108 114 L 119 62 Q 123 47 132 60 L 160 112 Q 167 124 171 110 L 182 62 Q 186 46 198 58 L 268 122 Q 280 132 280 116 L 280 62 Q 280 45 268 57 L 168 154" />
        </svg>
      </div>

      <h1 class="portal-title">
        每一类知识 · <span class="holo-span">点亮一颗专属行星</span>
      </h1>
      <p class="solar-hint">
        直接点击轨道上运行的行星（或下方星轨导航）即可跃迁至对应知识板块；未来向仓库新建更多顶层类别文件夹，外围待命行星将自动点亮归属。
      </p>

      <div class="cta-bar ui-interactive">
        <a href="./hub.html" class="plasma-cta warp-link">

        <form class="portal-search" id="portalSearchForm" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    </main>

    <!-- Spacer so central Solar System shines unobstructed in the middle -->
    <div style="flex:1;min-height:180px;pointer-events:none;"></div>

    <!-- Bottom Planetary Orbit Roster -->

      <div class="dock-header">
        <span class="dock-title">
          <span style="width:8px;height:8px;border-radius:50%;background:#F59E0B;box-shadow:0 0 10px #F59E0B;"></span>
          <span>行星轨道映射表 (PLANETARY KNOWLEDGE ORBITS)</span>
        </span>
        <span id="latestPushHint">正在同步 GitHub 仓库轨道数据...</span>
      </div>
      <div class="orbit-roster" id="orbitRoster"></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const REPO_OWNER = 'gohmadein';
    const REPO_NAME = 'themando';
    const BRANCH = 'main';
    const CACHE_KEY = 'themando_feed_cache_v3';
    const CACHE_TTL_MS = 5 * 60 * 1000;
    const IGNORED_ROOT_FILES = new Set([
      '.gitignore', '.nojekyll', 'index.html', 'hub.html', 'logo.svg', 'favicon.svg', 'CNAME', 'LICENSE'
    ]);

    localStorage.removeItem('themando_theme');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let warpMultiplier = 1;

    // 8 Solar System Planets — Categories map dynamically in order (Earth & Jupiter prioritized first for visual beauty, or sequential!)
    // Ordered inner-to-outer orbits; active categories claim planets starting from rich inner/mid worlds!
    const PLANET_DEFS = [
      { id: 'mercury', cnName: '水星轨道 · Mercury', radius: 7.5,  size: 0.52, speed: 0.42, angle: 0.8,  color: '#38BDF8', emissive: '#0284C7', bands: ['#7DD3FC', '#0284C7', '#1E3A8A'] },
      { id: 'venus',   cnName: '金星轨道 · Venus',   radius: 10.6, size: 0.68, speed: 0.31, angle: 2.4,  color: '#F59E0B', emissive: '#B45309', bands: ['#FDE68A', '#F59E0B', '#92400E'] },
      { id: 'earth',   cnName: '地球轨道 · Earth',   radius: 14.0, size: 0.76, speed: 0.24, angle: 4.1,  color: '#22C55E', emissive: '#0EA5E9', bands: ['#38BDF8', '#10B981', '#1D4ED8'], hasMoon: true },
      { id: 'mars',    cnName: '火星轨道 · Mars',    radius: 17.5, size: 0.60, speed: 0.19, angle: 5.5,  color: '#F97316', emissive: '#C2410C', bands: ['#FDBA74', '#EA580C', '#7C2D12'] },
      { id: 'jupiter', cnName: '木星轨道 · Jupiter', radius: 22.2, size: 1.18, speed: 0.13, angle: 1.6,  color: '#EAB308', emissive: '#A16207', bands: ['#FEF3C7', '#D97706', '#92400E', '#FDE68A'] },
      { id: 'saturn',  cnName: '土星轨道 · Saturn',  radius: 27.5, size: 0.98, speed: 0.095, angle: 3.6, color: '#FACC15', emissive: '#CA8A04', bands: ['#FEF08A', '#CA8A04', '#713F12'], hasRing: true },
      { id: 'uranus',  cnName: '天王星 · Uranus',    radius: 32.6, size: 0.78, speed: 0.07, angle: 0.3,  color: '#22D3EE', emissive: '#0891B2', bands: ['#A5F3FC', '#06B6D4', '#164E63'] },
      { id: 'neptune', cnName: '海王星 · Neptune',   radius: 37.4, size: 0.76, speed: 0.052, angle: 4.9, color: '#60A5FA', emissive: '#1D4ED8', bands: ['#93C5FD', '#2563EB', '#172554'] }
    ];

    // Default initial categories before GitHub sync completes (instant zero-flicker render)
    let planetAssignments = [
      { category: '学习', count: 3, url: './hub.html?channel=CAT:%E5%AD%A6%E4%B9%A0' },
      { category: '科研', count: 9, url: './hub.html?channel=CAT:%E7%A7%91%E7%A0%94' }
    ];

    let hoveredPlanetIndex = -1;
    const planetRuntime = [];

    function triggerWarp(url) {
      if (!url) return;
      if (reducedMotion.matches) {
        window.location.href = url;
        return;
      }
      warpMultiplier = 14;
      document.getElementById('warpCurtain').classList.add('active');
      setTimeout(() => { window.location.href = url; }, 310);
    }

    document.querySelectorAll('.warp-link').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        triggerWarp(el.getAttribute('href'));
      });
    });

    document.getElementById('portalSearchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('portalSearchInput').value.trim();
      triggerWarp(q ? `./hub.html?q=${encodeURIComponent(q)}` : './hub.html');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('portalSearchInput').focus();
      }
    });

    /* Build procedural banded planet texture */
    function makePlanetTexture(bands) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 128);
      bands.forEach((col, i) => g.addColorStop(i / (bands.length - 1), col));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 128);
      for (let i = 0; i < 26; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
        ctx.fillRect(0, Math.random() * 128, 256, Math.random() * 6 + 1);
      }
      return new THREE.CanvasTexture(c);
    }

    function makeGlowSpriteTexture(innerCol, outerCol) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
      g.addColorStop(0, innerCol);
      g.addColorStop(0.35, outerCol);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    /* Render floating HTML planet tags + bottom roster */
    function rebuildPlanetDomOverlays() {
      const layer = document.getElementById('planetLabelsLayer');
      const roster = document.getElementById('orbitRoster');
      layer.innerHTML = '';
      roster.innerHTML = '';

      const activeTotal = Math.min(planetAssignments.length, PLANET_DEFS.length);
      document.getElementById('activePlanetsStat').textContent =
        `已点亮 ${activeTotal} / ${PLANET_DEFS.length} 颗知识行星`;

      PLANET_DEFS.forEach((def, idx) => {
        const assigned = planetAssignments[idx] || null;

        // 1. Floating 3D-tracked anchor label
        const tag = document.createElement(assigned ? 'a' : 'div');
        tag.className = `planet-tag ${assigned ? 'active' : 'dormant'}`;
        if (assigned) {
          tag.href = assigned.url;
          tag.innerHTML = `
            <span class="planet-dot" style="background:${def.color};color:${def.color}"></span>
            <span>${assigned.category}星球</span>
            <span class="planet-count">${assigned.count} 专栏</span>
          `;
          tag.addEventListener('click', (e) => {
            if (e.metaKey || e.ctrlKey) return;
            e.preventDefault();
            triggerWarp(assigned.url);
          });
          tag.addEventListener('pointerenter', () => { hoveredPlanetIndex = idx; });
          tag.addEventListener('pointerleave', () => { hoveredPlanetIndex = -1; });
        } else {
          tag.innerHTML = `<span>${def.cnName.split(' ')[0]} · 待开拓</span>`;
        }
        layer.appendChild(tag);

        if (planetRuntime[idx]) {
          planetRuntime[idx].labelEl = tag;
          planetRuntime[idx].assigned = assigned;
          if (planetRuntime[idx].mesh && planetRuntime[idx].mesh.material) {
            planetRuntime[idx].mesh.material.opacity = assigned ? 1.0 : 0.36;
            planetRuntime[idx].mesh.material.emissiveIntensity = assigned ? 0.55 : 0.08;
          }
          if (planetRuntime[idx].orbitLine) {
            planetRuntime[idx].orbitLine.material.opacity = assigned ? 0.34 : 0.11;
            planetRuntime[idx].orbitLine.material.color.set(assigned ? def.color : '#475569');
          }
          if (planetRuntime[idx].halo) {
            planetRuntime[idx].halo.visible = Boolean(assigned);
          }
        }

        // 2. Bottom Planetary Roster Card
        const chip = document.createElement(assigned ? 'a' : 'div');
        chip.className = `orbit-chip ${assigned ? 'active' : 'unclaimed'}`;
        if (assigned) {
          chip.href = assigned.url;
          chip.addEventListener('click', (e) => {
            if (e.metaKey || e.ctrlKey) return;
            e.preventDefault();
            triggerWarp(assigned.url);
          });
          chip.addEventListener('pointerenter', () => { hoveredPlanetIndex = idx; });
          chip.addEventListener('pointerleave', () => { hoveredPlanetIndex = -1; });
        }
        chip.innerHTML = `
          <span class="orbit-sphere-icon" style="background:${def.color};box-shadow:${assigned ? '0 0 10px ' + def.color : 'none'}"></span>
          <span class="orbit-meta">
            <span class="orbit-planet-name">0${idx + 1} · ${def.cnName}</span>
            <span class="orbit-cat-name">${assigned ? `${assigned.category}频道 (${assigned.count})` : '待接入新类别'}</span>
          </span>
        `;
        roster.appendChild(chip);
      });
    }

    /* Boot 3D Three.js Interactive Solar System */
    function initSolarSystem3D() {
      const canvas = document.getElementById('solarCanvas');
      if (!canvas || !window.THREE) {
        rebuildPlanetDomOverlays();
        return;
      }

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 21, 44);

      const solarGroup = new THREE.Group();
      solarGroup.rotation.x = 0.12;
      scene.add(solarGroup);

      // Lighting: Blazing Central Sun PointLight + Soft Ambient Space Fill
      const ambient = new THREE.AmbientLight(0x93c5fd, 0.45);
      scene.add(ambient);
      const sunLight = new THREE.PointLight(0xffedd5, 2.8, 160, 0.45);
      solarGroup.add(sunLight);

      // Background Starfield
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(2200 * 3);
      for (let i = 0; i < 2200 * 3; i += 3) {
        starPos[i] = (Math.random() - 0.5) * 260;
        starPos[i + 1] = (Math.random() - 0.5) * 180;
        starPos[i + 2] = (Math.random() - 0.5) * 220 - 30;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbae6fd, size: 0.35, transparent: true, opacity: 0.78 }));
      scene.add(stars);

      // Blazing Central Sun + Multi-layer Corona Glow
      const sunTex = makePlanetTexture(['#FFFBEB', '#FDE047', '#F59E0B', '#EA580C', '#F59E0B']);
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(3.25, 40, 40),
        new THREE.MeshBasicMaterial({ map: sunTex })
      );
      solarGroup.add(sunMesh);

      const sunCorona = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGlowSpriteTexture('rgba(254,240,138,0.95)', 'rgba(245,158,11,0.34)'),
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      }));
      sunCorona.scale.set(14.5, 14.5, 1);
      solarGroup.add(sunCorona);

      // Asteroid Belt between Mars (17.5) and Jupiter (22.2)
      const beltCount = 420;
      const beltPos = new Float32Array(beltCount * 3);
      for (let i = 0; i < beltCount; i++) {
        const r = 19.3 + Math.random() * 1.4;
        const a = Math.random() * Math.PI * 2;
        beltPos[i * 3] = Math.cos(a) * r;
        beltPos[i * 3 + 1] = (Math.random() - 0.5) * 0.45;
        beltPos[i * 3 + 2] = Math.sin(a) * r;
      }
      const beltGeo = new THREE.BufferGeometry();
      beltGeo.setAttribute('position', new THREE.BufferAttribute(beltPos, 3));
      const asteroidBelt = new THREE.Points(beltGeo, new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.16, transparent: true, opacity: 0.45 }));
      solarGroup.add(asteroidBelt);

      // Create the 8 Planets & Orbit Rings
      const clickableMeshes = [];

      PLANET_DEFS.forEach((def, idx) => {
        // Orbit path circle
        const pts = [];
        for (let s = 0; s <= 128; s++) {
          const theta = (s / 128) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(theta) * def.radius, 0, Math.sin(theta) * def.radius));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const orbitMat = new THREE.LineBasicMaterial({ color: def.color, transparent: true, opacity: 0.25 });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        solarGroup.add(orbitLine);

        // Planet pivot & sphere
        const holder = new THREE.Group();
        solarGroup.add(holder);

        const pMat = new THREE.MeshStandardMaterial({
          map: makePlanetTexture(def.bands),
          emissive: new THREE.Color(def.emissive),
          emissiveIntensity: 0.4,
          roughness: 0.55,
          metalness: 0.1,
          transparent: true,
          opacity: 1
        });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(def.size, 32, 32), pMat);
        mesh.userData = { planetIndex: idx };
        holder.add(mesh);
        clickableMeshes.push(mesh);

        // Active beacon halo sprite
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: makeGlowSpriteTexture('#FFFFFF', def.color),
          blending: THREE.AdditiveBlending,
          transparent: true,
          opacity: 0.68,
          depthWrite: false
        }));
        halo.scale.set(def.size * 4.2, def.size * 4.2, 1);
        holder.add(halo);

        // Saturn's iconic rings
        if (def.hasRing) {
          const ringGeo = new THREE.RingGeometry(def.size * 1.45, def.size * 2.35, 64);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xfde047, side: THREE.DoubleSide, transparent: true, opacity: 0.48 });
          const saturnRing = new THREE.Mesh(ringGeo, ringMat);
          saturnRing.rotation.x = Math.PI * 0.42;
          holder.add(saturnRing);
        }

        // Earth's orbiting moon
        let moonPivot = null;
        if (def.hasMoon) {
          moonPivot = new THREE.Group();
          const moon = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 })
          );
          moon.position.set(def.size * 1.9, 0.15, 0);
          moonPivot.add(moon);
          holder.add(moonPivot);
        }

        planetRuntime.push({
          def,
          holder,
          mesh,
          halo,
          orbitLine,
          moonPivot,
          angle: def.angle,
          assigned: null,
          labelEl: null
        });
      });

      rebuildPlanetDomOverlays();

      // Pointer Parallax, Drag Rotation & Planet Raycasting
      const pointer = { nx: 0, ny: 0 };
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      let isDragging = false, dragMoved = false, prevX = 0, manualAzimuth = 0;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        dragMoved = false;
        prevX = e.clientX;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });

      window.addEventListener('pointermove', (e) => {
        pointer.nx = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.ny = -(e.clientY / window.innerHeight) * 2 + 1;

        if (isDragging) {
          const dx = e.clientX - prevX;
          if (Math.abs(dx) > 3) dragMoved = true;
          manualAzimuth += dx * 0.005;
          prevX = e.clientX;
        }

        ndc.set(pointer.nx, pointer.ny);
        raycaster.setFromCamera(ndc, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0) {
          const pIdx = hits[0].object.userData.planetIndex;
          if (planetRuntime[pIdx] && planetRuntime[pIdx].assigned) {
            hoveredPlanetIndex = pIdx;
            canvas.classList.add('hovering-planet');
            return;
          }
        }
        if (e.target === canvas) {
          hoveredPlanetIndex = -1;
          canvas.classList.remove('hovering-planet');
        }
      }, { passive: true });

      canvas.addEventListener('click', () => {
        if (dragMoved) return;
        if (hoveredPlanetIndex >= 0 && planetRuntime[hoveredPlanetIndex]?.assigned) {
          triggerWarp(planetRuntime[hoveredPlanetIndex].assigned.url);
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, { passive: true });

      const projVec = new THREE.Vector3();
      let prevTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        if (document.hidden) return;
        const dt = Math.min(0.05, (now - prevTime) / 1000);
        prevTime = now;

        if (!reducedMotion.matches) {
          sunMesh.rotation.y += dt * 0.25;
          asteroidBelt.rotation.y += dt * 0.04 * warpMultiplier;
          const pulse = 14.3 + Math.sin(now * 0.0025) * 0.6;
          sunCorona.scale.set(pulse, pulse, 1);

          solarGroup.rotation.y = manualAzimuth + pointer.nx * 0.22;
          const targetCamY = 20.5 - pointer.ny * 4.2;
          const targetCamZ = warpMultiplier > 1 ? 14 : 44;
          camera.position.y += (targetCamY - camera.position.y) * 0.05;
          camera.position.z += (targetCamZ - camera.position.z) * (warpMultiplier > 1 ? 0.1 : 0.05);
        }

        camera.lookAt(0, -1.5, 0);
        solarGroup.updateMatrixWorld();

        const halfW = window.innerWidth / 2;
        const halfH = window.innerHeight / 2;

        planetRuntime.forEach((rt, idx) => {
          const isHovered = hoveredPlanetIndex === idx;
          if (!reducedMotion.matches) {
            const speedFactor = isHovered ? 0.12 : 1;
            rt.angle += dt * rt.def.speed * speedFactor * warpMultiplier;
            rt.mesh.rotation.y += dt * 0.9;
            if (rt.moonPivot) rt.moonPivot.rotation.y += dt * 1.8;
          }

          rt.holder.position.set(
            Math.cos(rt.angle) * rt.def.radius,
            0,
            Math.sin(rt.angle) * rt.def.radius
          );

          const targetScale = isHovered ? 1.38 : (rt.assigned ? 1.08 : 0.85);
          rt.mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.14);

          // Project 3D planet world position to 2D screen anchor for floating label
          if (rt.labelEl) {
            rt.holder.getWorldPosition(projVec);
            projVec.y += rt.def.size * 1.45 + 0.55;
            projVec.project(camera);

            if (projVec.z > 1) {
              rt.labelEl.style.opacity = '0';
            } else {
              const sx = (projVec.x * halfW) + halfW;
              const sy = -(projVec.y * halfH) + halfH;
              const inBounds = sx > 40 && sx < window.innerWidth - 40 && sy > 75 && sy < window.innerHeight - 85;
              rt.labelEl.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0) translate(-50%, -100%)`;
              rt.labelEl.style.opacity = inBounds ? (rt.assigned ? '1' : '0.48') : '0';
              rt.labelEl.style.zIndex = rt.assigned ? '4' : '2';
            }
          }
        });

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    }

    /* Live GitHub Category Discovery -> Automatically assigns new folders to waiting planets! */
    async function syncCategoriesToPlanets() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached && cached.data && (Date.now() - cached.savedAt < CACHE_TTL_MS)) {
          applyRepoData(cached.data.posts, cached.data.commits);
          return;
        }
      } catch (_) {}

      try {
        const [treeRes, commitsRes] = await Promise.all([
          fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`),
          fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/commits?sha=${BRANCH}&per_page=5`)
        ]);
        if (!treeRes.ok) return;
        const treeJson = await treeRes.json();
        const commitsJson = commitsRes.ok ? await commitsRes.json() : [];

        const readmes = (treeJson.tree || []).filter(item =>
          item.type === 'blob' &&
          !IGNORED_ROOT_FILES.has(item.path) &&
          item.path !== 'README.md' &&
          item.path.endsWith('/README.md') &&
          !item.path.startsWith('.github/')
        );

        const syntheticPosts = readmes.map(r => ({
          topCategory: r.path.split('/')[0]
        }));
        const commits = commitsJson.map(c => ({
          sha: c.sha.slice(0, 7),
          message: c.commit.message.split('\n')[0]
        }));
        applyRepoData(syntheticPosts, commits);
      } catch (_) {}
    }

    function applyRepoData(posts, commits) {
      if (posts && posts.length) {
        const counts = new Map();
        posts.forEach(p => {
          counts.set(p.topCategory, (counts.get(p.topCategory) || 0) + 1);
        });
        planetAssignments = Array.from(counts.entries()).map(([cat, count]) => ({
          category: cat,
          count,
          url: `./hub.html?channel=${encodeURIComponent('CAT:' + cat)}`
        }));
        rebuildPlanetDomOverlays();
      }
      if (commits && commits[0]) {
        document.getElementById('latestPushHint').textContent =
          `最新仓库信号：[${commits[0].sha}] ${commits[0].message}`;
      }
    }

    initSolarSystem3D();
    syncCategoriesToPlanets();
  </script>
